<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Franken Panel: Panel autohospedado para administrar sitios, Nginx, SSL y despliegues en Ubuntu Server desde el navegador.">
<style>.pk{animation:pk 3.2s cubic-bezier(.45,0,.55,1) infinite}@keyframes pk{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(347.0px);opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.6);opacity:.45}}@media (prefers-reduced-motion:reduce){.pk,.dot{animation:none}}</style>
