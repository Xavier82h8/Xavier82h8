<text x="32" y="150" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#A85F00" textLength="351.0" lengthAdjust="spacingAndGlyphs">cloudflared → nginx → fastify :3001 → systemd</text><line x1="32" y1="158" x2="383.0" y2="158" stroke="#D3DDE5"/><rect class="pk" x="28" y="156.5" width="12" height="3" rx="1.5" fill="#A85F00"/>
