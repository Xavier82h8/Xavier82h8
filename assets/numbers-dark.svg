<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="~100 endpoints REST en tres APIs; ~330 tests automatizados backend y datos de MUSA-AI; 47 153 ejemplos curados dataset propio para afinar un LLM; 3 proyectos completos de la idea al servidor">
<defs><filter id="pb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><clipPath id="pc"><rect width="900" height="150" rx="14"/></clipPath><linearGradient id="ps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.11"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="pe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.26)"/><stop offset="1" stop-color="rgba(255,255,255,0.05)"/></linearGradient></defs>
<style>.blob{animation:drift 18s ease-in-out infinite alternate}.blob1{animation-duration:23s;animation-direction:alternate-reverse}.blob2{animation-duration:29s}@keyframes drift{from{transform:translate(0,0)}to{transform:translate(38px,-22px)}}@media (prefers-reduced-motion:reduce){.blob{animation:none}}</style>
<style>.u{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.n{opacity:0;animation:in .6s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.u{transform:none;animation:none}.n{opacity:1;animation:none}}</style>
