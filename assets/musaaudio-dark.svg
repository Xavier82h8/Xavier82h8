<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="MusaAudio: Música de escritorio y web con búsqueda unificada en YouTube, Spotify y archivos locales.">
<defs><filter id="pb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><clipPath id="pc"><rect width="900" height="200" rx="14"/></clipPath><linearGradient id="ps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.11"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="pe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.26)"/><stop offset="1" stop-color="rgba(255,255,255,0.05)"/></linearGradient></defs>
<style>.blob{animation:drift 18s ease-in-out infinite alternate}.blob1{animation-duration:23s;animation-direction:alternate-reverse}.blob2{animation-duration:29s}@keyframes drift{from{transform:translate(0,0)}to{transform:translate(38px,-22px)}}@media (prefers-reduced-motion:reduce){.blob{animation:none}}</style>
<style>.pk{animation:pk 3.2s cubic-bezier(.45,0,.55,1) infinite}@keyframes pk{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(370.4px);opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.6);opacity:.45}}@media (prefers-reduced-motion:reduce){.pk,.dot{animation:none}}</style>
<g clip-path="url(#pc)"><rect width="900" height="200" fill="#0A1520"/><g filter="url(#pb)"><circle class="blob blob0" cx="140" cy="10" r="120" fill="#2F7AA0" opacity="0.85"/><circle class="blob blob1" cx="860" cy="170" r="120" fill="#C2557A" opacity="0.45"/><circle class="blob blob2" cx="560" cy="220" r="70" fill="#F2A93B" opacity="0.55"/></g><rect width="900" height="200" fill="rgba(14,26,38,0.62)"/><rect width="900" height="200" fill="url(#ps)"/></g><rect x="0.75" y="0.75" width="898.5" height="198.5" rx="13.25" fill="none" stroke="url(#pe)" stroke-width="1.5"/>
<text x="32" y="56" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#D3DEE7">MusaAudio</text>
<text x="32" y="88" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#7F93A3">Música de escritorio y web con búsqueda unificada</text>
<text x="32" y="110" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#7F93A3">en YouTube, Spotify y archivos locales.</text>
<text x="32" y="150" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#F2A93B" textLength="374.4" lengthAdjust="spacingAndGlyphs">git push → GitHub Actions → docker → nginx (TLS)</text><line x1="32" y1="158" x2="406.4" y2="158" stroke="#24384A"/><rect class="pk" x="28" y="156.5" width="12" height="3" rx="1.5" fill="#F2A93B"/>
<text x="32" y="176" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#7F93A3">TypeScript · Express · Prisma · Jest · Docker · Tauri</text>
<line x1="560" y1="28" x2="560" y2="172" stroke="#24384A"/>
<rect x="584" y="49" width="7" height="7" rx="1.5" fill="#F2A93B"/>
<text x="602" y="58" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#D3DEE7">~36 endpoints REST</text>
<rect x="584" y="79" width="7" height="7" rx="1.5" fill="#F2A93B"/>
<text x="602" y="88" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#D3DEE7">JWT, bcrypt y rate limiting</text>
<rect x="584" y="109" width="7" height="7" rx="1.5" fill="#F2A93B"/>
<text x="602" y="118" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#D3DEE7">Caché con TTL y métricas por ruta</text>
<circle class="dot" cx="589" cy="172" r="4" fill="#4CC38A"/>
<text x="602" y="176" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7F93A3">Ficha técnica pública · código privado</text>
</svg>